[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
# The BSC mainnet-fork E2E package (`test/fork/`) is EXCLUDED from the default
# run on purpose: the mock suite must stay fast and OFFLINE. Fork tests need an
# archive RPC and take minutes, not milliseconds.
#   run them with:  FOUNDRY_PROFILE=fork forge test
# The how and the why are in `test/fork/ForkBase.t.sol`'s header. ⚠ the RPC
# must be an ARCHIVE endpoint: publicnode answers a pinned-block state read
# with HTTP 403, so `RPC_URL` from `.env.example` cannot serve a pinned fork.
no_match_path = "test/fork/**"
# Read everywhere; write ONLY into the two deployment-record directories.
# ⚠ `deployments/` (real chains, committed) and `.state/` (anvil, gitignored)
# are SEPARATE PATHS ON PURPOSE. The $154 loss in DEPLOY-SAFETY-PREFLIGHT §1
# happened because a fork rehearsal wrote its throwaway addresses into the
# mainnet env file. No script here writes an env file at all, and a local run
# cannot reach the mainnet record.
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./.state" },
]

# The fork profile: the SAME compiler settings, pointed at test/fork only.
# `no_match_path` is cleared to a pattern that matches nothing, because
# profiles inherit `[profile.default]` and would otherwise exclude the very
# directory they exist to run.
[profile.fork]
test = "test/fork"
no_match_path = "test/fork/__nothing_matches_this__/*"
# ⚠ THROTTLE THE FORK RPC. The fork suite fans out parallel storage reads that
# burst past a free archive tier's rate limit — the run then dies on HTTP 429
# mid-suite (Alchemy/dRPC free both do this), NOT on any test failure. Capping
# compute-units-per-second keeps the burst under the ceiling. Raise or delete
# this on a paid archive endpoint. Default is 330.
compute_units_per_second = 90

# BNB Chain is chain 56. Fork tests run against a real mainnet fork so the
# pancakeswap router, the chainlink BNB/USD feed and the VRF coordinator are
# the live contracts, not mocks — the whole point of the money-layer rewrite is
# that the fefers "native == USDT == the dollar" identity is false here, and
# only a fork proves it.
[rpc_endpoints]
bsc = "${RPC_URL}"
bsc_testnet = "${RPC_URL_TESTNET}"

# etherscan v2: one key works across chains, v1 per-chain endpoints are
# deprecated. VERIFY the exact incantation with a real key at deploy.
[etherscan]
bsc = { key = "${ETHERSCAN_API_KEY}", chain = 56, url = "https://api.etherscan.io/v2/api?chainid=56" }

[fmt]
line_length = 100
tab_width = 4
# ⚠ false, and it must stay false. It was `true` while every one of the ~90
# solidity files here is written `{Ownable}` with no inner spaces, so the
# setting was simply never exercised. Flipping it back to `true` does not tidy
# anything -- it rewrites every import in the project and buries the next real
# diff.
#
# ⚠ AND THE WIDER POINT: this codebase is NOT `forge fmt` clean, by choice.
# `forge fmt` also rewraps constructor modifier lists and long signatures onto
# single lines, which walks over comment alignment that is deliberate in
# Duel.sol and Bulls.sol. So CI does NOT gate on `forge fmt --check` -- see
# .github/workflows/ci.yml. Run `npm run fmt` only when you mean to reformat.
bracket_spacing = false

# ══════════════════════════════════════════════════════════════════════════
#  MintDrop.sol IS 139 BYTES OVER EIP-170 AT THE PROJECT SETTINGS
# ══════════════════════════════════════════════════════════════════════════
# ⚠ THIS IS NOT TUNING. WITHOUT IT `MintDrop` CANNOT BE DEPLOYED AT ALL.
#
# The live MintDrop (0xAE7e1F…) has a 23,773-byte runtime, i.e. 803 bytes of
# EIP-170 headroom. The BullPen wiring added to the source afterwards — the
# `_penWire` slot, its four admin calls, `penWire()`/`penContract()`, the four
# pen events and the `IBullPen.reserve` branch in `_mintAndEmit` — costs 942
# bytes. 942 > 803, so the committed source builds to 24,715 against a 24,576
# limit and `new MintDrop(...)` reverts with the code-size error.
#
# Nobody noticed because a zero pen address is today's behaviour byte-for-byte,
# so the contract was never rebuilt for deployment after the change.
#
# ⚠ THE PROJECT-WIDE SETTINGS ARE DELIBERATELY NOT TOUCHED. Every other contract
# in `deployments/56.json` was compiled at optimizer_runs = 200 and is verified
# on BscScan against exactly that; moving the global setting would mean the repo
# no longer reproduces the bytecode of the live set, and `verify-all.ps1` would
# stop being able to re-verify any of them. Restricting ONE file leaves every
# other artifact byte-identical.
#
# ⚠ `via_ir` WAS TRIED FIRST AND REJECTED ON BUILD TIME, not on output: a single
# `forge build` did not finish inside 15 minutes. A build nobody will wait for is
# a build that stops being run.
#
# ⚠⚠ THE MARGIN IS 128 BYTES, AT runs = 1, WHICH IS THE FLOOR OF THE LEGACY
# PIPELINE. There is no more room to buy here. The next thing added to
# `MintDrop` will not fit, and the fix at that point is structural, not a flag:
# fold the standalone `_penWire` slot into the existing `Wire` enum as an
# APPENDED member so it reuses `bootstrapWire`/`proposeWire`/`commitWire`/
# `cancelWire`/`wireOf`, keep `penContract()` as a one-line view over it, and
# delete the four bespoke pen admin functions and their four events. That is
# worth roughly 600-900 bytes and it was not done now only because the pen's
# admin ABI is already what the tests, the deploy script, the fleet and the
# admin panel are written against.
[[profile.default.additional_compiler_profiles]]
name = "mintdrop-size"
optimizer = true
optimizer_runs = 1

[[profile.default.compilation_restrictions]]
paths = "contracts/MintDrop.sol"
optimizer_runs = 1
